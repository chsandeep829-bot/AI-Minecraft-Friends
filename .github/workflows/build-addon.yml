name: Build Bedrock Add-on
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON and project contracts
        run: npm test
      - name: Check JavaScript syntax
        run: node --check behavior_pack/scripts/main.js
      - name: Package .mcaddon
        run: |
          mkdir -p dist
          cd behavior_pack
          zip -qr ../dist/AI-Friends-BP.mcpack .
          cd ../resource_pack
          zip -qr ../dist/AI-Friends-RP.mcpack .
          cd ../dist
          zip -q AI-Minecraft-Friends.mcaddon AI-Friends-BP.mcpack AI-Friends-RP.mcpack
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Minecraft-Friends-mcaddon
          path: dist/AI-Minecraft-Friends.mcaddon
          if-no-files-found: error
          retention-days: 30
